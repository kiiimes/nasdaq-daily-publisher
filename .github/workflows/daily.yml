name: NASDAQ public runner
on:
  schedule:
    - cron: '0 22 * * 1-5'  # Tue-Sat 07:00 Asia/Seoul (UTC+9)
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [health, connections, editorial, generate, daily, publish, render]
        default: daily
        required: true
      trade_date:
        description: Explicit US regular-close date YYYY-MM-DD (render only)
        type: string
        default: ''
        required: false
      connection_push_dry_run:
        description: Verify private SSH push authorization without pushing (connections only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: nasdaq-codex-production
  cancel-in-progress: false
jobs:
  preflight:
    if: >-
      github.repository == 'kiiimes/nasdaq-daily-publisher' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["editorial","generate","daily","publish"]'), inputs.mode)))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report missing activation settings without exposing credentials
        env:
          AUTOMATION_READY: ${{ vars.AUTOMATION_ENABLED == 'true' }}
          MODEL_READY: ${{ vars.MODEL_ISOLATION_VERIFIED == 'true' }}
          PUBLISH_READY: ${{ vars.PUBLISH_ENABLED == 'true' }}
          NEED_PUBLISH: ${{ github.event_name == 'schedule' || (inputs.mode == 'daily' || inputs.mode == 'publish') }}
          HAS_SESSION_KEY: ${{ secrets.CODEX_AUTH_KEY != '' }}
          HAS_STATE_KEY: ${{ secrets.STATE_DEPLOY_KEY != '' }}
          HAS_KIS_KEY: ${{ secrets.KIS_APP_KEY != '' && secrets.KIS_APP_SECRET != '' }}
          HAS_ASSETS_KEY: ${{ secrets.ASSETS_DEPLOY_KEY != '' }}
          HAS_INSTAGRAM_TOKEN: ${{ secrets.IG_ACCESS_TOKEN != '' }}
        run: |
          failed=0
          check() {
            if [ "$2" != true ]; then
              echo "::error::$1"
              printf -- '- %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          }
          check 'AUTOMATION_ENABLED is disabled' "$AUTOMATION_READY"
          check 'Model isolation verification is incomplete' "$MODEL_READY"
          check 'CODEX_AUTH_KEY is missing' "$HAS_SESSION_KEY"
          check 'STATE_DEPLOY_KEY is missing' "$HAS_STATE_KEY"
          check 'KIS credentials are missing' "$HAS_KIS_KEY"
          if [ "$NEED_PUBLISH" = true ]; then
            check 'PUBLISH_ENABLED is disabled' "$PUBLISH_READY"
            check 'ASSETS_DEPLOY_KEY is missing' "$HAS_ASSETS_KEY"
            check 'IG_ACCESS_TOKEN is missing' "$HAS_INSTAGRAM_TOKEN"
          fi
          exit "$failed"
  health:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'health'
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned rendering dependency
        run: python3 -m pip install 'Pillow==13.0.0'
      - name: Offline Python and Node regressions (synthetic data and mocks only)
        run: |
          export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)"
          python3 -m unittest discover -v -p 'test*.py'
          node --test test*.mjs
      - name: Public-only environment health (never automation readiness)
        run: python3 cloud_daily.py health
  connections:
    if: >-
      github.repository == 'kiiimes/nasdaq-daily-publisher' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'connections'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Checkout only private state using repository-scoped SSH
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kiiimes/nasdaq-instagram-automation
          ref: main
          path: runtime
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          persist-credentials: true
      - name: Stage explicit public runtime allowlist after strict private-origin guard
        run: node source/stage-runtime.mjs source runtime
      - name: Verify private SSH origin with optional captured push dry-run
        working-directory: runtime
        env:
          DRY_RUN: ${{ inputs.connection_push_dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            node ../source/verify-state-connection.mjs . --dry-run
          else
            node ../source/verify-state-connection.mjs .
          fi
  generate:
    needs: preflight
    outputs:
      publish_eligible: ${{ steps.generation.outputs.publish_eligible }}
    if: >-
      github.repository == 'kiiimes/nasdaq-daily-publisher' && github.ref == 'refs/heads/main' &&
      vars.AUTOMATION_ENABLED == 'true' && vars.MODEL_ISOLATION_VERIFIED == 'true' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'editorial' || inputs.mode == 'generate' || inputs.mode == 'daily')))
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: runtime
    env:
      AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'false' }}
      MODEL_ISOLATION_VERIFIED: ${{ vars.MODEL_ISOLATION_VERIFIED || 'false' }}
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate public generation gates BEFORE private checkout or secret restoration
        working-directory: source
        run: |
          test "$AUTOMATION_ENABLED" = true
          test "$MODEL_ISOLATION_VERIFIED" = true
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('cloud_config.json','utf8')); if(c.model_isolation_verified !== true) { console.error('Model isolation is unverified; generation disabled'); process.exit(1); }"
      - name: Verify pinned web-only tool boundary BEFORE private checkout
        working-directory: source
        run: |
          npm install --global '@openai/codex@0.166.0'
          export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)"
          python3 verify_editorial_isolation.py
      - name: Initialize isolated session home using runner environment
        working-directory: source
        run: |
          printf 'CODEX_HOME=%s/nasdaq-codex-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout latest private state using repository-scoped SSH
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kiiimes/nasdaq-instagram-automation
          ref: main
          path: runtime
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          persist-credentials: true
      - name: Stage explicit public runtime allowlist after strict private-origin guard
        working-directory: ${{ github.workspace }}
        run: node source/stage-runtime.mjs source runtime
      - name: Install pinned rendering dependency and verified Codex version
        run: |
          python3 -m pip install 'Pillow==13.0.0'
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('cloud_config.json')).codex_version")
          npm install --global "@openai/codex@$VERSION"
          codex --version
      - name: Initialize portable private state
        id: state
        run: node --input-type=module -e "import {materialize} from './cloud_publish.mjs'; await materialize(process.cwd())"
      - name: Restore encrypted managed session
        id: restore
        env:
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
        run: node codex_session.mjs restore --state codex_session.enc --home "$CODEX_HOME" --repository kiiimes/nasdaq-instagram-automation
      - name: Verify complete subscription generation in disposable workspace
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'editorial'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)"
          python3 ../source/verify_daily_pipeline.py
      - name: Generate independently verified date-aligned edition
        id: generation
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'editorial'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python3 cloud_daily.py generate
      - name: Always persist refreshed encrypted session after restore attempt
        if: always() && steps.restore.outcome != 'skipped' && steps.state.outcome == 'success'
        env:
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
        run: node codex_session.mjs persist --state codex_session.enc --home "$CODEX_HOME" --repository kiiimes/nasdaq-instagram-automation
      - name: Always checkpoint private generation and encrypted auth using SSH only
        if: always() && steps.state.outcome == 'success'
        run: node cloud_publish.mjs checkpoint
      - name: Always remove plaintext credentials (checkout post-action removes scoped SSH key)
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf "$CODEX_HOME" runtime/.instagram-api
          rm -f runtime/.env runtime/.kis-token.json
  publish:
    needs: [preflight, generate]
    if: >-
      always() && needs.preflight.result == 'success' && github.repository == 'kiiimes/nasdaq-daily-publisher' && github.ref == 'refs/heads/main' &&
      vars.AUTOMATION_ENABLED == 'true' && vars.MODEL_ISOLATION_VERIFIED == 'true' && vars.PUBLISH_ENABLED == 'true' &&
      ((github.event_name == 'schedule' && needs.generate.result == 'success' && needs.generate.outputs.publish_eligible == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily' && needs.generate.result == 'success' && needs.generate.outputs.publish_eligible == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtime
    env:
      AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'false' }}
      MODEL_ISOLATION_VERIFIED: ${{ vars.MODEL_ISOLATION_VERIFIED || 'false' }}
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Checkout private main AFTER successful generation push (or explicit publish)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kiiimes/nasdaq-instagram-automation
          ref: main
          path: runtime
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          persist-credentials: true
      - name: Stage the same immutable public source after strict private-origin guard
        working-directory: ${{ github.workspace }}
        run: node source/stage-runtime.mjs source runtime
      - name: Install pinned image validation dependency
        run: python3 -m pip install 'Pillow==13.0.0'
      - name: Initialize portable private state
        id: state
        run: node --input-type=module -e "import {materialize} from './cloud_publish.mjs'; await materialize(process.cwd())"
      - name: Observe real five-card stability and checkpoint via SSH
        run: node cloud_publish.mjs scan
      - name: Upload approved JPEG-only immutable assets
        env:
          ASSETS_DEPLOY_KEY: ${{ secrets.ASSETS_DEPLOY_KEY }}
        run: node upload-media.mjs prepare
      - name: Publish once with durable SSH-pushed preclaim
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_HOST: graph.facebook.com
          IG_VERSION: v26.0
          IG_ID: '17841426703447281'
        run: node cloud_publish.mjs publish
      - name: Always checkpoint private publish state using SSH only
        if: always() && steps.state.outcome == 'success'
        run: node cloud_publish.mjs checkpoint
      - name: Always remove plaintext credentials (checkout post-action removes scoped SSH key)
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf runtime/.instagram-api
          rm -f runtime/.env runtime/.kis-token.json
  render:
    if: >-
      github.repository == 'kiiimes/nasdaq-daily-publisher' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.mode == 'render'
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: runtime
    env:
      TRADE_DATE: ${{ inputs.trade_date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned rendering dependency
        working-directory: source
        run: python3 -m pip install 'Pillow==13.0.0'
      - name: Checkout reviewed private data using repository-scoped SSH
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kiiimes/nasdaq-instagram-automation
          ref: main
          path: runtime
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          persist-credentials: true
      - name: Stage explicit public runtime allowlist after strict private-origin guard
        working-directory: ${{ github.workspace }}
        run: node source/stage-runtime.mjs source runtime
      - name: Materialize private reservation state without authentication restoration
        run: node --input-type=module -e "import {materialize} from './cloud_publish.mjs'; await materialize(process.cwd())"
      - name: Render only existing independently verified reviewed data
        run: python3 ../source/manual_render.py --date "$TRADE_DATE"
      - name: Checkpoint allowlisted private render outputs only after success
        run: node ../source/manual_render_checkpoint.mjs --date "$TRADE_DATE"
